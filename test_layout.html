<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <section class="relative w-full flex flex-col justify-center items-center overflow-hidden bg-[#f5f2eb]">
        <!-- Normal -->
        <div class="relative z-10 w-full mt-0">
            <img src="https://via.placeholder.com/800x400" alt="Test" class="w-full h-auto block">
        </div>
        <div class="relative z-20 text-center px-6 max-w-4xl space-y-4 mt-6 sm:mt-24 bg-red-200">
            TEXT UNDER IMAGE
        </div>
    </section>
    
    <br><br>

    <section class="relative w-full flex flex-col justify-center items-center overflow-hidden bg-[#f5f2eb]">
        <!-- Bigger image -->
        <div class="relative z-10 w-[115%] sm:w-[110%] flex-shrink-0 max-w-none mt-0">
            <img src="https://via.placeholder.com/800x400" alt="Test" class="w-full h-auto block">
        </div>
        <div class="relative z-20 text-center px-6 max-w-4xl space-y-4 mt-6 sm:mt-24 bg-red-200">
            TEXT UNDER IMAGE
        </div>
    </section>
</body>
</html>
